# SageMaker launch config for the System1 RoboCasa JAX training (scripts/train.py).
# Use with: python scripts/sagemaker/launch.py --config scripts/sagemaker/config_robocasa_jax.yaml
#   (override fields on the CLI as usual, e.g. --instance.type=p5 --training.exp_name=run2)
#
# Differs from config.yaml (PyTorch/libero):
#   - image.sm_entrypoint = sm_entrypoint_jax.sh  -> JAX trainer, no torch_distributed
#   - data channels: `robocasa` (WebDataset shards+anchors) + `base_ckpt` (JAX orbax pi05_base)
#   - training.config = pi05_robocasa_system1* ; extra_args carries fsdp/batch/no-ema

aws:
  region: us-west-2
  profile: sagemaker
  role_arn: arn:aws:iam::124224456861:role/service-role/SageMaker-SageMakerAllAccess

job:
  user: yinpeidai
  name_prefix: pi05-robocasa-s1-jax
  max_run_days: 14
  volume_size: 300            # shards ~16GB + anchors + checkpoints + caches
  tags:
    - key: tri.owner.email
      value: yinpei.dai@tri.global
    - key: tri.project
      value: MM:PJ-0077

queue:
  name: vla
  priority: 10
  share_identifier: default

instance:
  type: p5                    # H100 — the point of going to SageMaker (fast vs local A6000)
  count: 1

image:
  base: 763104351884.dkr.ecr.{region}.amazonaws.com/pytorch-training:2.8.0-gpu-py312-cu129-ubuntu22.04-sagemaker
  repo_name: yinpeidai-openpi-train-jax
  # Bake the JAX trainer entrypoint (single process, FSDP over all GPUs).
  sm_entrypoint: sm_entrypoint_jax.sh

# Channels mounted at /opt/ml/input/data/<channel>/ (FastFile = stream, no download).
#   robocasa/{shards,anchors,meta.json}  -> the WebDataset dataset
#   base_ckpt/                           -> JAX pi05_base orbax `params` dir
# Norm stats (~3 KB) are baked into the image at /opt/ml/code/assets/<config>/.
data:
  channels:
    robocasa:
      s3_uri: s3://tri-ml-datasets-uw2/yinpeidai/robocasa_final_training_shard/system1_full_0711/
      input_mode: FastFile
    base_ckpt:
      s3_uri: s3://tri-ml-datasets-uw2/yinpeidai/openpi/released_ckpt/openpi-assets/checkpoints/pi05_base/
      input_mode: FastFile

training:
  config: pi05_robocasa_system1
  exp_name: full400k
  resume: false
  overwrite: false
  # JAX trainer args: shard over all GPUs, batch, EMA, step budget.
  # On p5 (8x H100) fsdp can be up to 8; batch must be divisible by device_count.
  # FULL RUN: 400k steps (~8 days @ ~1.74s/step), save+keep every 40k => 10 permanent
  #   ckpts (~120GB, fits volume_size 300). batch 128 (verified to fit locally).
  # LR/EMA overridden HERE (not in config.py) for the long horizon:
  #   - cosine decay 5e-5 -> 5e-6 over the full 400k, warmup 2k (was flat 5e-5, since the
  #     code default has peak==decay so decay never engaged). Cleaner final policy.
  #   - ema-decay 0.9999 (~10k-step window, 2.5% of run) vs 0.999's ~1k window which
  #     barely averages at this horizon. EMA weights are what we checkpoint/deploy.
  # --project-name sets the wandb project (the JAX trainer uses config.project_name,
  # NOT the wandb.project below / WANDB_PROJECT env, so it must be passed here).
  extra_args: "--fsdp-devices=8 --batch-size=128 --ema-decay=0.9999 --num-train-steps=400000 --save-interval=40000 --keep-period=40000 --lr-schedule.warmup-steps=2000 --lr-schedule.peak-lr=5e-5 --lr-schedule.decay-steps=400000 --lr-schedule.decay-lr=5e-6 --project-name=openpi-robocasa-system1"

output:
  s3_prefix: s3://tri-ml-datasets-uw2/yinpeidai/openpi/checkpoints/
  checkpoint_local_path: /opt/ml/checkpoints
  # JAX path only: how often the entrypoint's background `aws s3 sync` uploads the
  # local checkpoint dir to S3 (crash insurance; a final --delete sync runs on exit
  # regardless). NOTE: this is a WALL-CLOCK interval in SECONDS (entrypoint does
  # `sleep $CKPT_SYNC_INTERVAL`), NOT a step count. 30000s = ~8.3h for the full run.
  ckpt_sync_interval: 30000

wandb:
  enabled: true
  project: openpi-robocasa-system1-sagemaker
